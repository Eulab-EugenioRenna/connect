<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Workshop · Connect SDK</title>
<body><main><h1>Workshop</h1><p>Applicazione indipendente con BFF Connect. Le credenziali restano solo nei campi del modulo fino al loro invio esplicito.</p>
<form id="login"><label>Email <input name="email" type="email" required autocomplete="username"></label><label>Password locale <input name="password" type="password" autocomplete="current-password"></label><button>Accedi</button></form>
<form id="migration" hidden><h2>Consenso migrazione</h2><p id="action"></p><label>Password locale (prova) <input name="legacyPassword" type="password" required autocomplete="current-password"></label><label id="new-password" hidden>Nuova password Connect <input name="newConnectPassword" type="password" autocomplete="new-password"></label><label><input name="consent" type="checkbox" required>Acconsento alla migrazione verso Connect</label><button>Invia richiesta</button></form>
<details><summary>Richiedi attivazione di una nuova azienda</summary><form id="activation"><input name="companyName" placeholder="Azienda" required><input name="email" type="email" placeholder="Email" required><input name="firstName" placeholder="Nome" required><input name="lastName" placeholder="Cognome" required><input name="password" type="password" placeholder="Password Connect" required autocomplete="new-password"><label><input type="checkbox" required>Acconsento all’attivazione Connect</label><button>Richiedi attivazione</button></form></details>
<button id="configuration">Sincronizza configurazione approvata</button><button id="projects">Progetti</button><button id="refresh">Rinnova sessione</button><button id="logout">Esci</button><pre id="result" role="status"></pre></main><script src="/app.js" type="module"></script></body></html>
