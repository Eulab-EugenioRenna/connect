 roles(){const a=app(),scope=S.roleTenant,roles=S.data.roles.filter(r=>r.application_id===a.id&&r.tenant_id===scope);let r=roles.find(x=>x.role_key===S.roleKey)||roles[0];if(r)S.roleKey=r.role_key;return `${heading('Ruoli e permessi','L\'app suggerisce i ruoli. Qui approvi e modifichi i permessi effettivi, senza ampliare gli accessi automaticamente.',btn(icon('plus')+' Nuovo ruolo','new-role',true))}${appFilters(false)}<div class="filters">${select('role-tenant','Ambito',[{value:'',label:'Modello comune del prodotto'},...S.data.tenants.map(t=>({value:t.id,label:t.name}))],scope)}${select('role-select','Ruolo',roles.map(r=>({value:r.role_key,label:r.name})),r?.role_key||'')}</div>${r?`<form id="role-form" class="card"><div class="section-title"><div><h2>${esc(r.name)}</h2><p class="small muted mt">${esc(a.name)} &middot; revisione ${r.version}</p></div>${badge(scope?'Personalizzato per cliente':'Modello comune','blue')}</div><div class="checks">${a.manifest.permissions.map(p=>`<label class="check-row"><input type="checkbox" name="permission" value="${esc(p.key)}" ${r.permissions.includes(p.key)?'checked':''}><span>${esc(p.label)}<small>${esc(p.key)} &middot; ${esc(p.feature)}</small></span></label>`).join('')}</div><div class="savebar"><div class="field"><label>Motivo</label><input name="reason" required placeholder="Perché cambiano questi permessi?"></div><button class="btn primary">Salva permessi</button></div></form>`:'<div class="card empty">Nessun ruolo in questo ambito. Crea un ruolo cliente per personalizzarlo.</div>'}<div class="notice mt">Un permesso assegnato non attiva una funzione non acquistata. I ruoli dei clienti non conferiscono accesso a EULAB Admin.</div>`;},
 users(){return `${heading('Auth Panel / Utenti','Identità centrali, inviti e associazioni alle attività. Nessuna password visibile nel backoffice.',btn(icon('plus')+' Crea utente','new-user',true))}<div class="split"><div class="card"><div class="table-wrap"><table><thead><tr><th>Identità</th><th>Stato</th><th></th></tr></thead><tbody>${(S.users||[]).filter(u=>(u.email||'').toLowerCase().includes(S.search.toLowerCase())).map(u=>`<tr><td class="title-cell">${esc(u.name||u.email)}<small>${esc(u.email)}</small></td><td>${badge(u.enabled?'Attiva':'Sospesa',u.enabled?'green':'')}</td><td><button class="icon-button" data-action="select-user" data-id="${esc(u.id)}" aria-label="Gestisci ${esc(u.email)}">${icon('arrow')}</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Caricamento identità...</td></tr>'}</tbody></table></div></div><div>${userDetail()}</div></div>`;},
 sessions(){const users=S.users||[];return `${heading('Sessioni','Controlla gli accessi e revoca le sessioni dell\'identità selezionata. La revoca e verificata dalle API.')}<div class="filters">${select('session-user','Utente',users.map(u=>({value:u.id,label:u.email||u.name})),S.userId)}</div><div class="card"><div class="section-title"><h2>Sessioni SSO</h2>${btn(icon('sync')+' Aggiorna','load-sessions')}</div><div class="table-wrap"><table><thead><tr><th>Sessione</th><th>Ultimo accesso</th><th>Applicazioni</th><th></th></tr></thead><tbody>${(S.sessions||[]).map(s=>`<tr><td class="title-cell">${esc(s.id.slice(0,14))}<small>${esc(s.ipAddress||'-')}</small></td><td>${date(s.lastAccess||s.start)}</td><td>${esc(Object.values(s.clients||{}).join(', '))}</td><td>${btn('Revoca','revoke-session',false,`data-id="${esc(s.id)}"`)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Seleziona un utente e aggiorna le sessioni.</td></tr>'}</tbody></table></div></div>`;},
 sync(){return `${heading('Sincronizzazione','Cataloghi in ingresso, decisioni in uscita e conferme dell\'app. Nessun nuovo permesso viene concesso in automatico.')}<div class="card"><div class="section-title"><h2>Cataloghi ricevuti</h2>${btn(icon('sync')+' Aggiorna','refresh')}</div><div class="table-wrap"><table><thead><tr><th>Applicazione / versione</th><th>Stato</th><th>Ricevuto</th><th></th></tr></thead><tbody>${S.data.proposals.map(p=>{const d=S.data.deployments.find(d=>d.id===p.deployment_id);return `<tr><td class="title-cell">${esc(p.manifest.appId)} <small>${esc(p.version)} &middot; ${esc(d?.environment)}</small></td><td>${statusBadge(p.state)}</td><td>${date(p.created_at)}</td><td>${btn('Revisiona','review',false,`data-id="${esc(p.id)}"`)}</td></tr>`;}).join('')||'<tr><td colspan="4" class="empty">In attesa del primo getAppFunctionality() da un applicativo.</td></tr>'}</tbody></table></div></div><div class="card mt"><div class="section-title"><h2>Stato ambienti</h2></div><div class="table-wrap"><table><thead><tr><th>Ambiente</th><th>Policy desiderata</th><th>Osservata dall'agent</th><th>Ultimo contatto</th></tr></thead><tbody>${S.data.deployments.map(d=>`<tr><td>${esc(d.application_id)} / ${esc(d.environment)}</td><td>${S.data.apps.find(a=>a.id===d.application_id)?.version||'-'}</td><td>${d.observed_version||0}</td><td>${date(d.last_seen_at)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nessun agent collegato.</td></tr>'}</tbody></table></div></div><div class="notice mt">"Osservata" significa ricevuta dall'agent, non applicata a tutte le sessioni browser. Ogni richiesta protetta verifica comunque il contesto corrente sul backend.</div>`;},
 audit(){return `${heading('Registro attività','Tracciabilità delle modifiche a clienti, cataloghi, licenze e accessi. Non vengono registrati token o password.')}<div class="card"><div class="table-wrap"><table><thead><tr><th>Evento</th><th>Oggetto</th><th>Autore</th><th>Quando</th></tr></thead><tbody>${S.data.events.filter(e=>[e.action,e.target].join(' ').toLowerCase().includes(S.search.toLowerCase())).map(e=>`<tr><td class="title-cell">${esc(e.action)}</td><td>${esc(e.target)}</td><td class="small muted">${esc(e.actor.slice(0,25))}</td><td>${date(e.created_at)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nessuna modifica ancora registrata.</td></tr>'}</tbody></table></div></div>`;},
 settings(){return `${heading('Integrazione SDK','Un contratto comune per le app. Non è necessario migrare subito ALORA o NEXORA.')}<div class="grid2"><div class="card"><h2>Collega una nuova applicazione</h2>${[['Registra app e ambiente','Ottieni client OIDC e credenziale machine da conservare soltanto nel backend.'],['Dichiara il catalogo','Esponi getAppFunctionality() nel codice. La libreria pubblica JSON validato a SSO Hub.'],['Approva e configura','Revisiona il catalogo, assegna ruoli e abilita le funzioni acquistate per il cliente.'],['Applica e conferma','La libreria riceve versioni, aggiorna la UI e protegge le operazioni del backend.']].map(([t,d],i)=>`<div class="step"><div class="step-number">${i+1}</div><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</div><div class="stack"><div class="card"><div class="section-title"><h2>SSO & Policy</h2>${badge('Fonte centrale','blue')}</div><p class="small muted">Il backoffice usa lo stesso flusso OIDC delle app. Identità e sessioni sono gestite dal provider SSO; funzionalità e permessi dal policy engine di SSO Hub.</p><div class="code mt">getAppFunctionality()<br>app -&gt; SSO Hub -&gt; revisione Admin<br><br>getContext({ tenantId })<br>SSO Hub -&gt; SDK -&gt; UI + API</div></div><div class="card"><div class="section-title"><h2>EULAB Connect</h2>${badge('Fuori scope','')}</div><p class="small muted">Prevista integrazione trasversale WhatsApp self-service. Nessun collegamento WhatsApp viene attivato da questa versione.</p></div></div></div>`;}
};
function productCard(a){return `<article class="card product"><div class="product-head"><div class="product-icon ${a.id}">${esc(a.name[0])}</div><div><h2>${esc(a.name)}</h2><span class="tiny muted">${a.id==='alora'?'BEAUTY & SALON':a.id==='nexora'?'RETAIL & COMMERCE':'APPLICAZIONE EULAB'}</span></div><div class="product-meta">${statusBadge(a.status)}</div></div><p>${esc(a.description)}</p><div class="product-footer"><span>${a.manifest.features.length} funzioni nel catalogo</span><button class="text-button" data-action="select-app" data-id="${esc(a.id)}">Configura ${icon('arrow')}</button></div></article>`;}
function toggle(name,value,disabled,label){return `<label class="switch"><input type="checkbox" name="${esc(name)}" ${value?'checked':''} ${disabled?'disabled':''} aria-label="${esc(label)}"><span class="track"></span></label>`;}
function userDetail(){const u=(S.users||[]).find(u=>u.id===S.userId);if(!u)return '<div class="card empty">Seleziona un utente per gestire appartenenze e inviti.</div>';const m=S.data.memberships.find(m=>m.subject===u.id&&m.tenant_id===S.tenantId);return `<div class="card"><div class="section-title"><h2>${esc(u.name||u.email)}</h2></div><p class="small muted">${esc(u.email)}</p><div class="row mt">${btn('Invia invito','invite-user',false,`data-id="${esc(u.id)}"`)}${btn(u.enabled?'Sospendi':'Riattiva','toggle-user',false,`data-id="${esc(u.id)}"`)}</div><form id="membership-form"><div class="filters">${select('tenant-select','Attività',S.data.tenants.map(t=>({value:t.id,label:t.name})),S.tenantId)}</div><h3>Ruoli per applicazione</h3><div class="stack mt">${S.data.apps.filter(a=>a.id!=='eulab-admin').map(a=>`<div><div class="small muted">${esc(a.name)}</div>${effectiveRoles(a.id,S.tenantId).map(r=>`<label class="check-row"><input type="checkbox" name="role:${esc(a.id)}" value="${esc(r.role_key)}" ${m?.roles[a.id]?.includes(r.role_key)?'checked':''}>${esc(r.name)}</label>`).join('')}</div>`).join('')}</div><button class="btn primary mt" ${!S.tenantId?'disabled':''}>Salva appartenenza</button></form></div>`;}
function effectiveRoles(appId,tenantId){const roles=new Map();for(const r of S.data.roles.filter(r=>r.application_id===appId&&r.tenant_id===''))roles.set(r.role_key,r);for(const r of S.data.roles.filter(r=>r.application_id===appId&&r.tenant_id===tenantId))roles.set(r.role_key,r);return [...roles.values()];}
function modal(title,description,content,submitLabel='Salva',formId='modal-form'){dialog.innerHTML=`<h2>${title}</h2><p>${description}</p><form id="${formId}">${content}<div class="actions"><button type="button" class="btn" data-action="close-dialog">Chiudi</button>${submitLabel?`<button class="btn primary">${submitLabel}</button>`:''}</div></form>`;dialog.showModal();}
const input=(name,label,placeholder='',type='text',value='',required=true)=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" placeholder="${placeholder}" value="${esc(value)}" ${required?'required':''}></div>`;
async function navigate(page){S.page=page;S.search='';render();if(['users','sessions'].includes(page)){try{S.users=(await request('/bff/users')).users;if(!S.userId&&S.users.length)S.userId=S.users[0].id;render();}catch(e){toast(e.message);}}}
root.addEventListener('click',async e=>{const page=e.target.closest('[data-page]');if(page){await navigate(page.dataset.page);return;}const el=e.target.closest('[data-action]');if(!el)return;try{await action(el.dataset.action,el.dataset.id);}catch(err){toast(err.message);}});
dialog.addEventListener('click',e=>{if(e.target.closest('[data-action="close-dialog"]'))dialog.close();});
async function action(action,id){if(action==='menu'){document.querySelector('.sidebar').classList.toggle('open');return;}if(action==='refresh')return refresh();if(action==='logout'){if(demo)return toast('Anteprima: nessuna sessione SSO reale.');const b=await request('/auth/logout','POST');location.assign(b.redirect);return;}
 if(action==='go-apps')return navigate('apps');if(action==='go-features')return navigate('features');if(action==='select-app'){S.appId=id;return navigate('apps');}if(action==='configure-tenant'){S.tenantId=id;return navigate('features');}
 if(action==='new-tenant')return modal('Nuovo cliente','Crea l\'attività. Applicazioni e diritti d\'uso verranno assegnati separatamente.',input('name','Nome attività','Es. Cinque Sorsi')+input('reference','Riferimento interno','Es. referente o codice cliente'),'Crea cliente','tenant-form');
 if(action==='new-app')return modal('Aggiungi applicazione','Il catalogo arriverà tramite la libreria. Nessun accesso cliente viene concesso automaticamente.',input('id','Identificativo stabile','es. lab-store')+input('name','Nome prodotto','Es. Gestione attività')+input('description','Descrizione','Scopo dell\'applicazione'),'Registra app','app-form');
 if(action==='new-deployment')return modal(`Collega ${esc(app().name)}`,'Scegli webapp o WordPress: callback esatto e credenziali solo server. Ogni sito WordPress va registrato come app distinta.',input('environment','Ambiente','development / staging / production')+input('origin','Origine applicazione','https://sito.example','url')+`<div class="field"><label for="integration">Tipo integrazione</label><select id="integration" name="integration"><option value="web">Webapp / libreria JavaScript</option><option value="wordpress">WordPress / plugin EULAB SSO Hub</option></select></div>`+input('basePath','Sottocartella WordPress (facoltativa)','/blog','text','',false),'Genera configurazione','deployment-form');
 if(action==='show-manifest')return modal('Catalogo dichiarato','Dati, non codice da eseguire nel browser.',`<pre class="code">${esc(JSON.stringify(app().manifest,null,2))}</pre>`,null);
 if(action==='new-role')return modal('Nuovo ruolo','Il ruolo appartiene all\'app e all\'ambito selezionati. Inizia senza permessi.',input('key','Identificativo','es. warehouse-manager')+input('name','Nome ruolo','Es. Responsabile magazzino'),'Crea ruolo','new-role-form');
 if(action==='select-user'){S.userId=id;return render();}if(action==='new-user')return modal('Crea identità','Dopo la creazione invia l\'invito. Per l\'invio email è necessario SMTP configurato nel provider SSO.',input('email','Email','nome@azienda.it','email'),'Crea utente','user-form');
 if(action==='invite-user'){await request(`/bff/users/${id}/invite`,'POST',{});return toast('Invito inviato.');}
 if(action==='toggle-user'){const u=S.users.find(u=>u.id===id);await request(`/bff/users/${id}/enabled`,'PUT',{enabled:!u.enabled});S.users=(await request('/bff/users')).users;await refresh();return toast('Stato identità aggiornato.');}
 if(action==='load-sessions'){if(!S.userId)return;S.sessions=(await request(`/bff/users/${S.userId}/sessions`)).sessions;return render();}
 if(action==='revoke-session'){await request(`/bff/users/${S.userId}/sessions/${id}`,'DELETE');await action('load-sessions');return toast('Sessione revocata.');}
 if(action==='review'){const p=S.data.proposals.find(p=>p.id===id);S.proposalId=id;const old=S.data.apps.find(a=>a.id===p.manifest.appId);const added=p.manifest.features.filter(f=>!old.manifest.features.some(x=>x.key===f.key));const removed=old.manifest.features.filter(f=>!p.manifest.features.some(x=>x.key===f.key));return modal('Revisione catalogo',`${esc(p.manifest.appId)} / v${esc(p.version)}. I ruoli già assegnati non acquisiscono nuovi permessi automaticamente.`,`<div class="notice">${added.length} nuove funzioni &middot; ${removed.length} rimosse &middot; ${p.manifest.permissions.length} permessi dichiarati</div><pre class="code">${esc(JSON.stringify(p.manifest,null,2))}</pre>${p.state==='pending'?select('review-decision','Decisione',[{value:'approve',label:'Approva catalogo'},{value:'reject',label:'Rifiuta'}],'approve')+input('reason','Motivo','Verificato con il rilascio dell\'app'):''}`,p.state==='pending'?'Conferma revisione':null,'review-form');}
}
root.addEventListener('change',e=>{const id=e.target.id;if(id==='tenant-select')S.tenantId=e.target.value;else if(id==='app-select'){S.appId=e.target.value;S.roleKey='owner';}else if(id==='role-select')S.roleKey=e.target.value;else if(id==='role-tenant')S.roleTenant=e.target.value;else if(id==='session-user'){S.userId=e.target.value;S.sessions=[];}else return;render();});
root.addEventListener('input',e=>{if(e.target.id==='search-input'){S.search=e.target.value;document.querySelector('#page-content').innerHTML=pages[S.page]();}});
async function submit(e){e.preventDefault();const form=e.target,fd=new FormData(form),id=form.id;let message='Modifica salvata.';const submit=form.querySelector('button[type="submit"],button:not([type])');if(submit)submit.disabled=true;
 try{
 if(id==='tenant-form'){const b=await request('/bff/tenants','POST',{name:fd.get('name'),reference:fd.get('reference')});S.tenantId=b.id;S.page='clients';}
 else if(id==='app-form'){await request('/bff/apps','POST',Object.fromEntries(fd));S.appId=fd.get('id');S.page='apps';}
 else if(id==='deployment-form'){const b=await request(`/bff/apps/${S.appId}/deployments`,'POST',Object.fromEntries(fd));dialog.close();await refresh();modal('Configurazione generata','Credenziali mostrate una sola volta. Conservale in un secret manager, mai nel frontend o nel repository.',`<div class="notice warning">La registrazione non migra l\'autenticazione dell'app. Installa la libreria oppure il plugin WordPress e verifica il flusso. Il tenant e il mapping delle identita devono essere autorizzati separatamente.</div><pre class="code">${esc(JSON.stringify(b,null,2))}</pre>`,null);return;}
 else if(id==='license-form'){const a=app(),l=S.data.licenses.find(l=>l.tenant_id===S.tenantId&&l.application_id===a.id),entitlements={};for(const f of a.manifest.features){const limit=fd.get(`limit:${f.key}`);entitlements[f.key]={granted:fd.has(`grant:${f.key}`),enabled:fd.has(`enable:${f.key}`),limit:limit===''||limit===null?null:Number(limit)};}await request(`/bff/tenants/${S.tenantId}/licenses/${a.id}`,'PUT',{expectedVersion:l?.version||0,state:document.querySelector('#license-state').value,deploymentId:document.querySelector('#license-deployment').value||null,expiresAt:l?.expires_at||null,entitlements,reason:fd.get('reason')});}
 else if(id==='role-form'){const r=S.data.roles.find(r=>r.application_id===S.appId&&r.tenant_id===S.roleTenant&&r.role_key===S.roleKey);await request(`/bff/apps/${S.appId}/roles`,'PUT',{tenantId:S.roleTenant,key:r.role_key,name:r.name,permissions:fd.getAll('permission'),expectedVersion:r.version,reason:fd.get('reason')});}
 else if(id==='new-role-form'){await request(`/bff/apps/${S.appId}/roles`,'PUT',{tenantId:S.roleTenant,key:fd.get('key'),name:fd.get('name'),permissions:[],expectedVersion:0,reason:'Creazione ruolo senza permessi'});S.roleKey=fd.get('key');}
 else if(id==='user-form'){await request('/bff/users','POST',{email:fd.get('email')});S.users=(await request('/bff/users')).users;message='Identità creata. Invio invito separato.';}
 else if(id==='membership-form'){const old=S.data.memberships.find(m=>m.subject===S.userId&&m.tenant_id===S.tenantId),roles={};for(const a of S.data.apps.filter(a=>a.id!=='eulab-admin'))roles[a.id]=fd.getAll(`role:${a.id}`);await request(`/bff/tenants/${S.tenantId}/memberships`,'PUT',{subject:S.userId,roles,state:'active',expectedVersion:old?.version||0});}
 else if(id==='review-form'){const p=S.data.proposals.find(p=>p.id===S.proposalId),a=S.data.apps.find(a=>a.id===p.manifest.appId);await request(`/bff/proposals/${p.id}/review`,'POST',{decision:document.querySelector('#review-decision').value,expectedAppVersion:a.version,reason:fd.get('reason')});}
 else return;
 if(dialog.open)dialog.close();await refresh();toast(demo?`${message} Solo in questa anteprima.`:message);
 }catch(err){toast(err.message);}finally{if(submit)submit.disabled=false;}
}
root.addEventListener('submit',submit);dialog.addEventListener('submit',submit);
async function boot(){try{S.session=await request('/bff/session');if(!S.session.isEulabAdmin){root.innerHTML=`<main class="login"><div class="card login-card"><h1>Accesso non consentito</h1><p>L'identità è autenticata, ma non ha il ruolo EULAB Admin.</p><button class="btn" id="denied-logout">Esci</button></div></main>`;document.querySelector('#denied-logout').onclick=()=>action('logout');return;}await refresh();}catch{root.innerHTML=`<main class="login"><section class="card login-card"><div class="logo"><span class="logo-mark">e</span><span><span class="logo-name">EULAB</span><span class="logo-sub">ADMIN CONSOLE</span></span></div><div class="kicker">UN ACCESSO, TUTTO L'ECOSISTEMA</div><h1 class="mt">Bentornato.</h1><p>Accedi con la tua identità EULAB SSO Hub per gestire applicazioni, clienti e autorizzazioni.</p><a class="btn primary" href="/auth/login">Accedi con EULAB SSO ${icon('arrow')}</a><p class="tiny">L'accesso al backoffice richiede il ruolo EULAB Admin. La registrazione pubblica è disabilitata.</p></section></main>`;}}
boot();
</script></body></html>
