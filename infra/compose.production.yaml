# Merge with compose.yaml; never merge with the QA overlays.
name: eulab-connect-production
x-production-oidc: &production-oidc
 OIDC_ISSUER: https://auth.eulab.cloud/sso/realms/eulab
 OIDC_INTERNAL_ISSUER: http://keycloak:8080/sso/realms/eulab
 OIDC_JWKS_URL: http://keycloak:8080/sso/realms/eulab/protocol/openid-connect/certs
 OIDC_IDENTITY_ADMIN_SECRET: ${OIDC_IDENTITY_ADMIN_SECRET:?Genera .env.production}
services:
 postgres:
  restart: unless-stopped
 redis:
  restart: unless-stopped
 keycloak:
  image: eulab-connect-keycloak-production
  build: {context: ., dockerfile: infra/keycloak/Dockerfile.production}
  command: [start, --optimized, --import-realm]
  ports: !reset []
  environment:
   KC_HOSTNAME: https://auth.eulab.cloud/sso
   KC_HOSTNAME_STRICT: 'true'
   KC_HTTP_RELATIVE_PATH: /sso
   KC_PROXY_HEADERS: xforwarded
   KC_HTTP_ENABLED: 'true'
  volumes: !override
   - ./infra/keycloak/realm.production.json:/opt/keycloak/data/import/eulab-realm.json:ro
   - ./infra/keycloak/themes/eulab:/opt/keycloak/themes/eulab:ro
  restart: unless-stopped
 migrate:
  environment: *production-oidc
 api:
  environment: *production-oidc
 bootstrap:
  environment:
   <<: *production-oidc
   KEYCLOAK_INTERNAL_URL: http://keycloak:8080/sso
   PUBLIC_CONNECT_URL: https://connect.eulab.cloud
 runner:
  environment: *production-oidc
 web:
  build:
   target: web-production
   args:
    EULAB_ADMIN_BASE_PATH: /admin/
  ports: !override
   - ${CONNECT_BIND_IP:?Imposta IP privato Connect}:${CONNECT_HTTP_PORT:-8088}:80
  environment:
   NPM_TRUSTED_CIDR: ${NPM_TRUSTED_CIDR:?Imposta IP o CIDR del server NPM}
  volumes: !override
   - ./infra/production/web-config.js:/usr/share/nginx/html/admin/config.js:ro
