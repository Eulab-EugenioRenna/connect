map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=connect:10m rate=15r/s;
server {
 listen 80;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 client_max_body_size 15m;
 location = /downloads/euconnect.php {
  default_type application/octet-stream;
  add_header Content-Disposition 'attachment; filename="euconnect.php"';
  add_header X-Content-Type-Options nosniff;
  try_files $uri =404;
 }
 location /v1/ {
  limit_req zone=connect burst=30 nodelay;
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 75s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location / { try_files $uri /index.html; add_header Cache-Control no-store; }
}
